name: Build App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Prepare Clean Environment and Gradle
      run: |
        flutter create . --org com.ai.phone --project-name aiphone --platforms=android
        mkdir -p lib

    - name: Restore Main Dart Code
      run: |
        # التأكد من وجود ملف الكود الرئيسي وعدم فقدانه بأي شكل
        if [ ! -f "lib/main.dart" ]; then
          echo "Restoring main.dart file..."
        fi

    - name: Get Dependencies
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
