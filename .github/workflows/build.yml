name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Fix Pubspec Name & Build
        run: |
          # التأكد من أن اسم المشروع في pubspec.yaml مضبوط بحروف صغيرة دائماً لتجنب الخطأ
          sed -i 's/^name:.*/name: lifepilot_os/' pubspec.yaml
          
          # بناء التطبيق مباشرة بدون إعادة إنشاء تالفة
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
