name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'

      - name: Fix Gradle & Build APK
        run: |
          # تنظيف أي مخلفات قديمة
          flutter clean
          flutter pub get
          
          # الانتقال لمجلد أندرويد وتحديث ملف الـ gradle wrapper لضمان عدم حدوث أي خطأ تجميع
          cd android
          ./gradlew wrapper --gradle-version 7.5 || true
          cd ..
          
          # بناء ملف الـ APK بنجاح تام
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
