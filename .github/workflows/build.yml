name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build APK Direct
        run: |
          # تحديث الحزم وبناء المشروع الأساسي مباشرة بدون إعادة إنشاء معقدة
          flutter pub get
          
          # تعديل ملف gradle-wrapper لتفادي أي خطأ في الإصدارات
          if [ -d "android" ]; then
            cd android
            ./gradlew wrapper --gradle-version 8.5 || true
            cd ..
          fi
          
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
