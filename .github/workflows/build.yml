name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Fresh Project & Build APK
        run: |
          # مسح أي ملفات أندرويد قديمة تسبب المشكلة
          rm -rf android ios linux macos windows web
          
          # إنشاء مشروع فلاتر جديد ونظيف بالاسم والصيغة الصحيحة
          flutter create . --platforms=android --project-name=ai_phone
          
          # تعديل اسم التطبيق في ملف الإعدادات
          sed -i 's/^name:.*/name: ai_phone/' pubspec.yaml

          # جلب المكتبات والبناء مباشرة
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
