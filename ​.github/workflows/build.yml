name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Clean Build and Generate Compatible Android
        run: |
          sed -i 's/^name:.*/name: lifepilot_os/' pubspec.yaml
          
          # حذف أي ملفات أندرويد سابقة قديمة
          rm -rf android
          
          # إنشاء مشروع جديد مؤقت ونظيف استخراج ملفات الأندرويد منه لضمان التوافق التام
          flutter create temp_project --platforms=android --project-name=lifepilot_os
          cp -r temp_project/android ./android
          rm -rf temp_project
          
          # بناء التطبيق بصيغة Debug بنجاح تام
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
